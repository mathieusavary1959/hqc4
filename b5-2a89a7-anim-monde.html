<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MOC5+ : animation d'ouverture</title>
<style>
  
  html, body { margin: 0; padding: 0; background: #080809; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { width: 100vw; height: 100vh; display: block; }

  #halo { opacity: 0; animation: haloIn 1.0s ease-out 0.05s forwards; }
  @keyframes haloIn { to { opacity: 1; } }

  /* La planete : nee au centre, elle glisse ensuite a sa place a droite. */
  #globe {
    transform: translate(640px, 320px);
    animation: glisseGlobe 0.75s cubic-bezier(.3,.85,.3,1) 2.50s forwards;
  }
  @keyframes glisseGlobe {
    from { transform: translate(640px, 320px); }
    to   { transform: translate(818px, 320px); }
  }

  /* Le contour de la planete se trace. */
  #contour {
    stroke-dasharray: 491;
    stroke-dashoffset: 491;
    animation: trace 1.15s cubic-bezier(.4,.6,.3,1) 0.25s forwards;
  }
  @keyframes trace { to { stroke-dashoffset: 0; } }

  #monde { opacity: 0; animation: fonduIn 0.9s ease-out 0.85s forwards; }
  @keyframes fonduIn { to { opacity: 1; } }

  /* Les continents defilent sans fin : la planete tourne. */
  #defile {
    animation: defileContinents 9s linear infinite;
  }
  @keyframes defileContinents {
    from { transform: translateX(0px); }
    to   { transform: translateX(-220px); }
  }

  /* Le + nait au centre de la planete, un seul battement a l'arrivee, puis il se tient tranquille. */
  #croix {
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    animation: croixIn 0.45s cubic-bezier(.25,.9,.3,1.35) 1.55s forwards, battementUnique 0.7s ease-in-out 3.45s 1;
  }
  @keyframes croixIn {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }
  @keyframes battementUnique {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.09); }
  }

  #eclat {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
    animation: eclatJaillit 0.5s ease-out 1.95s forwards;
  }
  @keyframes eclatJaillit {
    0%   { opacity: 0; transform: scale(0.45); }
    22%  { opacity: 1; }
    100% { opacity: 0; transform: scale(1.5); }
  }

  .lettre {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 168px;
    fill: #2F9BFF;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes lettreIn {
    from { opacity: 0; transform: translateX(-30px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  #l-0 { animation: lettreIn 0.45s cubic-bezier(.25,.8,.3,1) 2.55s forwards; }
  #l-1 { animation: lettreIn 0.45s cubic-bezier(.25,.8,.3,1) 2.65s forwards; }
  #l-2 { animation: lettreIn 0.45s cubic-bezier(.25,.8,.3,1) 2.75s forwards; }
  #l-3 { animation: lettreIn 0.45s cubic-bezier(.25,.8,.3,1) 2.85s forwards; }

  #ligne {
    transform-box: fill-box;
    transform-origin: center;
    transform: scaleX(0);
    animation: ligneIn 0.5s cubic-bezier(.3,.85,.3,1) 3.45s forwards;
  }
  @keyframes ligneIn { to { transform: scaleX(1); } }

  #mention {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 9px;
    fill: #BDBDBD;
    opacity: 0;
    animation: mentionIn 0.7s ease-out 3.80s forwards;
  }
  @keyframes mentionIn { to { opacity: 0.95; } }
</style>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
