  .entete { max-width: 1240px; width: 100%; margin: 0 auto; }
  #catLabel { color: #2F9BFF; font-weight: 800; letter-spacing: 4px; font-size: 15px; text-transform: uppercase; }
  #catTitle { font-family: 'Bebas Neue', sans-serif; font-size: clamp(38px, 5.2vw, 72px); line-height: 1.02; letter-spacing: 1px; margin-top: 2px; text-shadow: 0 4px 30px rgba(0,0,0,0.8); }
  #consigne { color: #cfd6dd; font-size: clamp(15px, 1.5vw, 19px); font-weight: 600; margin-top: 4px; }
  #zone { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
  #cartes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; max-width: 1240px; width: 100%; }
  .carte {
    background: rgba(16, 19, 24, 0.92); border: 1px solid #2b3138; border-radius: 16px;
    overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,0.55);
    animation: entree 0.55s cubic-bezier(.25,.8,.3,1) both;
  }
  .carte:nth-child(2) { animation-delay: 0.07s; } .carte:nth-child(3) { animation-delay: 0.14s; } .carte:nth-child(4) { animation-delay: 0.21s; }
  @keyframes entree { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  .visuel { position: relative; aspect-ratio: 4 / 3; background: #0b0e12; overflow: hidden; }
  .visuel img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 18px 26px; }
  .visuel .icone { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .visuel .icone svg { width: 46%; height: 46%; }
  .rang {
    position: absolute; top: 12px; left: 12px; width: 44px; height: 44px; border-radius: 50%;
    background: #2F9BFF; color: #fff; font-family: 'Bebas Neue', sans-serif; font-size: 26px;
    display: none; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,0.5);
  }
  body.reveal .rang { display: flex; }
  .nom {
    font-family: 'Bebas Neue', sans-serif; font-size: clamp(24px, 2.4vw, 36px); letter-spacing: 0.6px;
    text-align: center; padding: 14px 10px 4px; line-height: 1.05;
  }
  .sous { text-align: center; color: #9aa4ad; font-size: 13.5px; font-weight: 600; padding: 0 12px 14px; min-height: 20px; }
  .valeur {
    display: none; text-align: center; font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(25px, 2.35vw, 34px); white-space: nowrap; color: #2F9BFF; padding: 2px 8px 16px; letter-spacing: 1px;
  }
  body.reveal .valeur { display: block; animation: entree 0.5s ease both; }
  #source { text-align: center; color: #77828c; font-size: 13px; font-weight: 600; min-height: 20px; margin-top: 12px; opacity: 0; transition: opacity 0.4s; }
  body.reveal #source { opacity: 1; }
  .barre {
    max-width: 1240px; width: 100%; margin: 8px auto 0; padding: 16px 0 22px;
    display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  .nav, #btnToggle {
    font-family: 'Poppins', sans-serif; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
    border-radius: 10px; cursor: pointer; transition: all 0.22s ease; position: relative; overflow: hidden;
  }
  .nav { background: #161a20; color: #aeb7bf; border: 1px solid #2e353d; font-size: 13px; padding: 14px 26px; }
  .nav:hover:not(:disabled) { color: #fff; border-color: #4a545e; }
  .nav:disabled { opacity: 0.35; cursor: default; }
  #btnToggle { background: #2F9BFF; color: #fff; border: 1px solid #2F9BFF; font-size: 17px; padding: 15px 52px; box-shadow: 0 10px 30px rgba(47,155,255,0.35); }
  #btnToggle:hover { filter: brightness(1.12); }
  #btnToggle::after, .nav::after {
    content: ''; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg); transition: left 0.6s ease;
  }
  #btnToggle:hover::after, .nav:hover::after { left: 130%; }
</style>
</head>
<body>
  <div class="entete">
    <div id="catLabel"></div>
    <div id="catTitle"></div>
    <div id="consigne"></div>
  </div>
  <div id="zone"><div id="cartes"></div></div>
  <div id="source"></div>
  <div class="barre">
    <button class="nav" id="btnPrev">Précédent</button>
    <button id="btnToggle">Vérifier</button>
    <button class="nav" id="btnNext">Suivant</button>
