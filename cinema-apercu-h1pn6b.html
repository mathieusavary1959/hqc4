<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cinéma &amp; Hasard - Films québécois</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  <style>

    :root { --accent: #ffd700; --bg: #111; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #000; color: #fff; height: 100vh;
      display: flex; flex-direction: column;
      padding: 20px 40px 110px 40px; overflow: hidden; position: relative;
    }

    /* Arrière-plan Dés / Cube Hasard */
    body::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(circle at center, transparent, #000),
        url('https://www.transparenttextures.com/patterns/cubes.png');
      z-index: -1; opacity: 0.25; animation: pan 100s linear infinite;
    }
    @keyframes pan { from { background-position: 0 0; } to { background-position: 1000px 1000px; } }

    .header-area { margin-bottom: 12px; flex-shrink: 0; }
    .cat-label { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 3px; }
    .cat-title { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; }

    .view-container { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px; width: 100%; max-width: 1400px;
    }

    /* Zone de jeu : grand écran, titre du film écrit dessous, cartes des films */
    #gameArea {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      width: 100%; transition: 0.6s;
    }
    body.reveal #gameArea { opacity: 0; pointer-events: none; transform: translateY(-30px); }

    #answerWrap { position: absolute; opacity: 0; pointer-events: none; transform: translateY(30px); transition: 0.6s; display: flex; align-items: center; justify-content: center; width: 100%; }
    body.reveal #answerWrap { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .card {
      background: #1a1a1a; border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
      cursor: pointer; transition: 0.4s; border: 2px solid #333;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .card:hover { transform: translateY(-8px); border-color: var(--accent); }

    /* Grand écran central : la bande-annonce y joue en plein cadre */
    .ecran {
      width: min(880px, 100%); aspect-ratio: 16/9; background: #000;
      position: relative; overflow: hidden; border-radius: 12px;
      border: 2px solid #333; box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      cursor: pointer; flex-shrink: 0;
    }
    .ecran iframe {
      position: absolute; inset: 0;
      width: 100% !important; height: 100% !important;
      border: 0; display: block;
    }
    #lecteur { position: absolute; inset: 0; }

    /* Masque du haut : cache la barre de titre YouTube ; l'année n'y paraît jamais */
    .masque-haut {
      position: absolute; top: 0; left: 0; right: 0; height: 56px;
      background: #000; z-index: 3; pointer-events: none;
    }

    /* Voile de fin : couvre la vidéo dès que la bande-annonce se termine */
    .voile-fin {
      position: absolute; inset: 0; z-index: 6; background: #000;
      display: none; align-items: center; justify-content: center;
      color: var(--accent); font-weight: 900; letter-spacing: 3px;
      text-transform: uppercase; font-size: 1.1rem; text-align: center; padding: 10px;
    }
    .voile-fin.on { display: flex; }

    /* Invitation à cliquer : grand bouton de lecture, tant que rien ne joue */
    .invite {
      position: absolute; inset: 0; z-index: 5; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    .invite .cercle {
      width: 88px; height: 88px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.85); background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
    }
    .invite .tri {
      width: 0; height: 0; margin-left: 8px;
      border-left: 27px solid #fff;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
    }
    .ecran.en-lecture .invite { display: none; }

    /* Titre du film, écrit sous l'écran */
    .film-sous-ecran { text-align: center; line-height: 1.15; }
    .film-sous-ecran b { display: block; font-size: 2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }

    /* Cartes des films du thème : on choisit lequel regarder */
    .minis {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
      width: min(880px, 100%);
    }
    .mini .mini-ecran {
      width: 100%; aspect-ratio: 16/9; background: #000; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .mini .mini-tri {
      width: 0; height: 0; margin-left: 4px;
      border-left: 16px solid rgba(255,255,255,0.9);
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
    }
    .mini .card-info { min-height: 64px; padding: 8px 10px; }
    .mini.actif { border-color: var(--accent); box-shadow: 0 0 25px rgba(255,215,0,0.35); }

    .card-info {
      padding: 15px;
      background: #222;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-top: 2px solid #333;
    }
    .card-info b { display: block; font-size: 1rem; color: #fff; }

    /* Badge de l'année, révélé seulement à la vérification, comme dans la musique */
    .year-tag {
      position: absolute; top: 12px; left: 12px; background: var(--accent); color: #000;
      padding: 4px 14px; border-radius: 6px; font-weight: 900; z-index: 20; font-size: 1.3rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .rep-ecran {
      width: 100%; aspect-ratio: 16/9; background: #000; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .rep-ecran .mini-tri {
      width: 0; height: 0; margin-left: 5px;
      border-left: 22px solid rgba(255,255,255,0.85);
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
    }
    .answer-card { cursor: default; }
    .answer-card:hover { transform: none; border-color: #333; }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 100px;
      display: flex; align-items: center; justify-content: center; gap: 30px;
      background: rgba(0,0,0,0.9); border-top: 1px solid #444; z-index: 10;
    }
    .btn-side { background: #333; color: #fff; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-family: inherit; }
    .btn-main { background: var(--accent); color: #000; border: none; padding: 15px 60px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-family: inherit; }

  </style>
</head>
<body>

  <div class="header-area">
    <div class="cat-label" id="catLabel">SESSION #1 / 1</div>
    <div class="cat-title" id="catTitle">Chargement...</div>
  </div>

  <div class="view-container">
    <div id="gameArea">
      <div class="ecran" id="grandEcran">
        <div id="lecteur"></div>
        <div class="masque-haut"></div>
        <div class="invite"><div class="cercle"><div class="tri"></div></div></div>
        <div class="voile-fin" id="voileGrand">Fin de la séquence</div>
      </div>
      <div class="film-sous-ecran">
        <b id="filmTitre"></b>
      </div>
      <div class="minis" id="minis"></div>
    </div>
    <div id="answerWrap">
      <div id="answerGrid" class="grid"></div>
    </div>
  </div>

  <div class="nav-bar">
    <button class="btn-side" onclick="prev()">PRÉCÉDENT</button>
    <button class="btn-main" id="btnToggle" onclick="toggle()">VÉRIFIER</button>
    <button class="btn-side" onclick="next()">SUIVANT</button>
  </div>

  <script>
    const BLOCKS = [
      { name: "Films québécois", items: [
        { titre: "Les Boys", video: "dQHhinKxC_0", annee: 1997 },
        { titre: "Lance et compte", video: "RyDJvM1KDek", annee: 1986 },
        { titre: "Bon Cop Bad Cop", video: "bhNtnPEImAY", annee: 2006 },
        { titre: "C.R.A.Z.Y.", video: "N1Dvh3Xh_9k", annee: 2005 }
      ] }
    ];

    let cur = 0;
    let filmCourant = 0;

    const minis = document.getElementById('minis');
    const answerGrid = document.getElementById('answerGrid');
    const catLabel = document.getElementById('catLabel');
    const catTitle = document.getElementById('catTitle');
    const btnToggle = document.getElementById('btnToggle');
    const grandEcran = document.getElementById('grandEcran');
    const voileGrand = document.getElementById('voileGrand');
    const zoneLecteur = document.getElementById('lecteur');
    const filmTitre = document.getElementById('filmTitre');

    function detruireIframe() {
      zoneLecteur.innerHTML = '';
      grandEcran.classList.remove('en-lecture');
      voileGrand.classList.remove('on');
    }

    /* Écoute des états du lecteur intégré : à la fin, on couvre l'écran */
    window.addEventListener('message', function (e) {
      if (typeof e.data !== 'string') return;
      let d = null;
      try { d = JSON.parse(e.data); } catch (err) { return; }
      if (d && d.event === 'onStateChange' && d.info === 0) {
        voileGrand.classList.add('on');
        zoneLecteur.innerHTML = '';
      }
    });

    function lancer(film) {
      detruireIframe();
      const f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + film.video +
        '?autoplay=1&rel=0&hl=fr&playsinline=1&enablejsapi=1';
      f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
      f.setAttribute('title', '');
      f.addEventListener('load', function () {
        try {
          f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'cinema', channel: 'widget' }), '*');
        } catch (err) {}
      });
      zoneLecteur.appendChild(f);
      grandEcran.classList.add('en-lecture');
    }

    function choisirFilm(i, jouer) {
      filmCourant = i;
      const bloc = BLOCKS[cur];
      const film = bloc.items[i];
      filmTitre.textContent = film.titre;
      minis.querySelectorAll('.mini').forEach(function (m) {
        m.classList.toggle('actif', parseInt(m.dataset.i, 10) === i);
      });
      if (jouer) lancer(film); else detruireIframe();
    }

    function render() {
      detruireIframe();
      document.body.classList.remove('reveal');
      btnToggle.textContent = 'VÉRIFIER';
      const bloc = BLOCKS[cur];
      catLabel.textContent = 'SESSION #' + (cur + 1) + ' / ' + BLOCKS.length;
      catTitle.textContent = bloc.name;

      minis.innerHTML = bloc.items.map(function (it, i) {
        return '<div class="card mini" data-i="' + i + '">' +
          '<div class="mini-ecran"><div class="mini-tri"></div></div>' +
          '<div class="card-info"><b>' + it.titre + '</b></div>' +
        '</div>';
      }).join('');
      minis.querySelectorAll('.mini').forEach(function (m) {
        m.addEventListener('click', function () { choisirFilm(parseInt(m.dataset.i, 10), true); });
      });

      const tries = bloc.items.slice().sort(function (a, b) { return a.annee - b.annee; });
      answerGrid.innerHTML = tries.map(function (it) {
        return '<div class="card answer-card">' +
          '<div class="year-tag">' + it.annee + '</div>' +
          '<div class="rep-ecran"><div class="mini-tri"></div></div>' +
          '<div class="card-info"><b>' + it.titre + '</b></div>' +
        '</div>';
      }).join('');

      choisirFilm(0, false);
    }

    grandEcran.addEventListener('click', function () {
      if (!zoneLecteur.querySelector('iframe')) {
        lancer(BLOCKS[cur].items[filmCourant]);
      }
    });

    function toggle() {
      const ouvert = document.body.classList.toggle('reveal');
      btnToggle.textContent = ouvert ? 'RETOUR' : 'VÉRIFIER';
      if (ouvert) detruireIframe();
    }

    function next() { if (cur < BLOCKS.length - 1) { cur++; render(); } }
    function prev() { if (cur > 0) { cur--; render(); } }

    render();
  </script>

</body>
</html>
