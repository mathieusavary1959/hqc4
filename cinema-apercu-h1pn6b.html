<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cinéma & Hasard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  <style>

    :root { --accent: #ff0055; --bg: #0a0a0c; --card-bg: #1c1c1f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg); color: #fff; height: 100vh;
      display: flex; flex-direction: column;
      padding: 20px 40px 110px 40px; overflow: hidden; position: relative;
    }

    /* Arrière-plan Hasard / Casino, comme la version musicale */
    body::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 0, 85, 0.1) 0%, transparent 40%),
        url('https://www.transparenttextures.com/patterns/poker-qr.png');
      z-index: -1; opacity: 0.6;
    }

    .header-area { margin-bottom: 15px; flex-shrink: 0; text-align: left; }
    .cat-label { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 3px; }
    .cat-title { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; line-height: 1; }

    .view-container { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px; width: 100%; max-width: 1400px;
    }

    /* Zone de jeu : grand écran, titre du film écrit dessous, cartes des films */
    #gameArea {
      display: flex; flex-direction: column; align-items: center; gap: 2%;
      width: 100%; height: 100%; align-self: stretch; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.reveal #gameArea { opacity: 0; pointer-events: none; transform: scale(1.05); }

    #answerWrap { position: absolute; opacity: 0; pointer-events: none; transform: scale(0.95); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; width: 100%; }
    body.reveal #answerWrap { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .card {
      background: var(--card-bg); border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
      cursor: pointer; transition: 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 15px 40px rgba(255, 0, 85, 0.2); }

    /* Grand écran central : la bande-annonce y joue en plein cadre */
    .ecran {
      width: min(880px, 100%, calc((100dvh - 210px) * 1.1022)); aspect-ratio: 16/9; max-height: 62%; background: #000;
      position: relative; overflow: hidden; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: pointer; flex-shrink: 0; transition: box-shadow 0.3s ease;
    }
    .ecran:hover { box-shadow: 0 15px 40px rgba(255, 0, 85, 0.2); }
    .ecran iframe {
      position: absolute; inset: 0;
      width: 100% !important; height: 100% !important;
      border: 0; display: block;
    }
    #lecteur { position: absolute; inset: 0; }

    /* Masque du haut : cache la barre de titre YouTube ; l'année n'y paraît jamais */
    .masque-haut {
      position: absolute; top: 0; left: 0; right: 0; height: 56px;
      background: #000; z-index: 3; pointer-events: none;
    }

    /* Voile de fin : couvre la vidéo dès que la bande-annonce se termine */
    .voile-fin {
      position: absolute; inset: 0; z-index: 6; background: #000;
      display: none; align-items: center; justify-content: center;
      color: var(--accent); font-weight: 900; letter-spacing: 3px;
      text-transform: uppercase; font-size: 1.1rem; text-align: center; padding: 10px;
    }
    .voile-fin.on { display: flex; }

    /* Invitation à cliquer : grand bouton de lecture, tant que rien ne joue */
    .invite {
      position: absolute; inset: 0; z-index: 5; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    .invite .cercle {
      width: 88px; height: 88px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.85); background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
    }
    .invite .tri {
      width: 0; height: 0; margin-left: 8px;
      border-left: 27px solid #fff;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
    }
    .ecran.en-lecture .invite { display: none; }

    /* Titre du film, écrit sous l'écran */
    .film-sous-ecran { text-align: center; line-height: 1.15; height: 8%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .film-sous-ecran b { display: block; font-size: 2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }

    /* Cartes des films du thème : on choisit lequel regarder */
    .minis {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
      width: min(880px, 100%); height: 26%; flex-shrink: 0;
    }
    .img-container { width: 100%; aspect-ratio: 16/9; position: relative; background: #000; }
    .img-container img { width: 100%; height: 100%; object-fit: cover; display: block; transition: 0.5s; }
    .card:hover .img-container img { filter: brightness(0.5); }
    .img-container .mini-tri {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 0; height: 0; margin-left: 3px;
      border-left: 22px solid rgba(255,255,255,0.85);
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
    }
    .mini .img-container .mini-tri { border-left-width: 16px; border-top-width: 10px; border-bottom-width: 10px; }
    .mini.actif { border-color: var(--accent); box-shadow: 0 0 25px rgba(255, 0, 85, 0.35); }
    .mini { height: 100%; }
    .mini .img-container { flex: 1 1 auto; min-height: 0; aspect-ratio: auto; }
    .mini .card-info { flex: 0 0 25%; min-height: 34px; }

    .card-info {
      padding: 15px;
      background: #111;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .card-info b { display: block; font-size: 1rem; color: #fff; }
    .card-info b.long { font-size: 0.8rem; line-height: 1.15; }
    .card-info b.treslong { font-size: 0.66rem; line-height: 1.12; }

    /* Badge de l'année, révélé seulement à la vérification, comme dans la musique */
    .year-tag {
      position: absolute; top: 12px; left: 12px; background: var(--accent); color: #fff;
      padding: 4px 12px; border-radius: 6px; font-weight: 900; z-index: 20; font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .answer-card { cursor: default; }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 100px;
      display: flex; align-items: center; justify-content: center; gap: 30px;
      background: rgba(10, 10, 12, 0.9); backdrop-filter: blur(10px); border-top: 1px solid #333; z-index: 10;
    }
    .btn-side { background: #222; color: #aaa; border: 1px solid #444; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.3s; font-family: inherit; }
    .btn-side:hover { color: #fff; border-color: #fff; }
    .btn-main { background: #fff; color: #000; border: none; padding: 15px 60px; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; font-family: inherit; }
    .btn-main:hover { background: var(--accent); color: #fff; transform: scale(1.05); }

  </style>
</head>
<body>

  <div class="header-area">
    <div class="cat-label" id="catLabel">SESSION #1 / 1</div>
    <div class="cat-title" id="catTitle">Chargement...</div>
  </div>

  <div class="view-container">
    <div id="gameArea">
      <div class="ecran" id="grandEcran">
        <div id="lecteur"></div>
        <div class="masque-haut"></div>
        <div class="invite"><div class="cercle"><div class="tri"></div></div></div>
        <div class="voile-fin" id="voileGrand">Fin de la séquence</div>
      </div>
      <div class="film-sous-ecran">
        <b id="filmTitre"></b>
      </div>
      <div class="minis" id="minis"></div>
    </div>
    <div id="answerWrap">
      <div id="answerGrid" class="grid"></div>
    </div>
  </div>

  <div class="nav-bar">
    <button class="btn-side" onclick="prev()">PRÉCÉDENT</button>
    <button class="btn-main" id="btnToggle" onclick="toggle()">VÉRIFIER</button>
    <button class="btn-side" onclick="next()">SUIVANT</button>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const BLOCKS = [
      { name: "Films québécois", items: [
        { titre: "Les Boys", video: "eCH5XvjWws4", annee: 1997 },
        { titre: "Lance et compte", video: "RyDJvM1KDek", annee: 1986 },
        { titre: "Bon Cop Bad Cop", video: "bhNtnPEImAY", annee: 2006 },
        { titre: "C.R.A.Z.Y.", video: "FdJD1nzhYrk", annee: 2005 },
      ] },
      { name: "Comédies françaises", items: [
        { titre: "Les Visiteurs", video: "wOMZzFIhPL0", annee: 1993 },
        { titre: "Intouchables", video: "EsaX5kltRcA", annee: 2011 },
        { titre: "Le Dîner de cons", video: "wx0mwd9l93Q", annee: 1998 },
        { titre: "Le Fabuleux Destin d’Amélie Poulain", video: "preWVaHzVXU", annee: 2001 },
      ] },
      { name: "Films d’animation", items: [
        { titre: "Shrek", video: "rijb0QZ-zoM", annee: 2001 },
        { titre: "Le Roi lion", video: "HnVpgdROquU", annee: 1994 },
        { titre: "Là-haut", video: "p-TdCD6DBfM", annee: 2009 },
        { titre: "Toy Story", video: "Iear4Rn1bio", annee: 1995 },
      ] },
      { name: "Blockbusters", items: [
        { titre: "Titanic", video: "-rtWImYYpzw", annee: 1997 },
        { titre: "E.T. l’extra-terrestre", video: "G2GT8e5sS8U", annee: 1982 },
        { titre: "Jurassic Park", video: "YmA6ThaXS34", annee: 1993 },
        { titre: "Retour vers le futur", video: "M8qyf_PQ8ZM", annee: 1985 },
      ] },
      { name: "Super-héros", items: [
        { titre: "The Dark Knight", video: "UMgb3hQCb08", annee: 2008 },
        { titre: "X-Men", video: "mGDlG-znG-4", annee: 2000 },
        { titre: "Avengers", video: "b-kTeJhHOhc", annee: 2012 },
        { titre: "Spider-Man", video: "OFijO5eH3ok", annee: 2002 },
      ] },
      { name: "Grandes sagas", items: [
        { titre: "Harry Potter à l’école des sorciers", video: "P1BGgqhVGAI", annee: 2001 },
        { titre: "Star Wars : Un nouvel espoir", video: "PNyht4iTMX8", annee: 1977 },
        { titre: "Hunger Games", video: "Z2EpODCH3as", annee: 2012 },
        { titre: "Indiana Jones et les Aventuriers de l’Arche Perdue", video: "Jt3YXpxcyLY", annee: 1981 },
      ] },
      { name: "Films d’action", items: [
        { titre: "Speed", video: "WRiNBuu62-4", annee: 1994 },
        { titre: "Piège de cristal", video: "JM7h-Wt12Hs", annee: 1988 },
        { titre: "Mission: Impossible", video: "GLuyM4ldLQ8", annee: 1996 },
        { titre: "Terminator 2", video: "QYRt2n0DdAQ", annee: 1991 },
      ] },
      { name: "Films de Noël", items: [
        { titre: "Maman, j’ai raté l’avion", video: "GPtHAQARLdw", annee: 1990 },
        { titre: "Le Grinch", video: "YeBjoa-LRNA", annee: 2000 },
        { titre: "Le Lutin", video: "LiU1B7H0gAo", annee: 2003 },
        { titre: "Klaus", video: "h5gR4vUb2rA", annee: 2019 },
      ] },
      { name: "Jeux vidéo au cinéma", items: [
        { titre: "Les Mondes de Ralph", video: "igpNoKG_QO0", annee: 2012 },
        { titre: "Détective Pikachu", video: "cMRqlDBkdwo", annee: 2019 },
        { titre: "Super Mario Bros. le film", video: "Bx7AOmoDGyQ", annee: 2023 },
        { titre: "Un Minecraft Film", video: "R59ZeaOcUbY", annee: 2025 },
      ] },
      { name: "Super-héros d’aujourd’hui", items: [
        { titre: "Deadpool", video: "XWtH7anz7io", annee: 2016 },
        { titre: "Black Panther", video: "8RQpN5kQslw", annee: 2018 },
        { titre: "Joker", video: "_LUWnjT3iks", annee: 2019 },
        { titre: "Spider-Man: No Way Home", video: "o-qvJ2iUqvA", annee: 2021 },
      ] },
      { name: "L’animation de leur enfance", items: [
        { titre: "Les Nouveaux Héros", video: "bCqe_Pokr-k", annee: 2014 },
        { titre: "Zootopie", video: "RTZlzdHuIQQ", annee: 2016 },
        { titre: "Spider-Man: New Generation", video: "eGDqpAM6Gyk", annee: 2018 },
        { titre: "Le Chat Potté 2 : La dernière quête", video: "fwiLlB-hIFQ", annee: 2022 },
      ] },
      { name: "Frissons", items: [
        { titre: "La Conjuration", video: "McOmzgX09wo", annee: 2013 },
        { titre: "Ça", video: "0zkm6IPr3Jw", annee: 2017 },
        { titre: "Sans un bruit", video: "OfImjmzcvLA", annee: 2018 },
        { titre: "Cinq nuits chez Freddy", video: "iUgc6N37QmU", annee: 2023 },
      ] },
      { name: "Aventures d’aujourd’hui", items: [
        { titre: "Le Labyrinthe", video: "LyPiCH_4Al4", annee: 2014 },
        { titre: "Ready Player One", video: "oYGkAMHCOC4", annee: 2018 },
        { titre: "Dune", video: "gHt8tCHbB2M", annee: 2021 },
        { titre: "Avatar : La voie de l’eau", video: "V_pb0BT2USk", annee: 2022 },
      ] },
    ];

    let cur = 0;
    let filmCourant = 0;

    const minis = document.getElementById('minis');
    const answerGrid = document.getElementById('answerGrid');
    const catLabel = document.getElementById('catLabel');
    const catTitle = document.getElementById('catTitle');
    const btnToggle = document.getElementById('btnToggle');
    const grandEcran = document.getElementById('grandEcran');
    const voileGrand = document.getElementById('voileGrand');
    const zoneLecteur = document.getElementById('lecteur');
    const filmTitre = document.getElementById('filmTitre');

    let lecteurYT = null;

    function detruireIframe() {
      if (lecteurYT) { try { lecteurYT.destroy(); } catch (err) {} lecteurYT = null; }
      zoneLecteur.innerHTML = '';
      grandEcran.classList.remove('en-lecture');
      voileGrand.classList.remove('on');
    }

    /* Écoute des états du lecteur intégré : à la fin, on couvre l'écran */
    window.addEventListener('message', function (e) {
      if (typeof e.data !== 'string') return;
      let d = null;
      try { d = JSON.parse(e.data); } catch (err) { return; }
      if (d && d.event === 'onReady' && e.source) {
        try {
          e.source.postMessage(JSON.stringify({ event: 'command', func: 'unloadModule', args: ['captions'], id: 'cinema', channel: 'widget' }), '*');
        } catch (err) {}
        return;
      }
      if (d && d.event === 'onStateChange' && d.info === 0) {
        voileGrand.classList.add('on');
        zoneLecteur.innerHTML = '';
      }
    });

    let apiYTPrete = false;
    window.onYouTubeIframeAPIReady = function () { apiYTPrete = true; };

    function couperSousTitres(p) {
      try { p.unloadModule('captions'); } catch (err) {}
      try { p.setOption('captions', 'track', {}); } catch (err) {}
    }

    function lancer(film) {
      detruireIframe();
      grandEcran.classList.add('en-lecture');
      if (apiYTPrete && window.YT && YT.Player) {
        const support = document.createElement('div');
        zoneLecteur.appendChild(support);
        lecteurYT = new YT.Player(support, {
          width: '100%', height: '100%', videoId: film.video,
          playerVars: { autoplay: 1, rel: 0, hl: 'fr', playsinline: 1, cc_load_policy: 0 },
          events: {
            onReady: function (e) { couperSousTitres(e.target); e.target.playVideo(); },
            onStateChange: function (e) {
              if (e.data === YT.PlayerState.PLAYING) couperSousTitres(e.target);
              if (e.data === YT.PlayerState.ENDED) { detruireIframe(); voileGrand.classList.add('on'); }
            }
          }
        });
        return;
      }
      const f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + film.video +
        '?autoplay=1&rel=0&hl=fr&playsinline=1&enablejsapi=1&cc_load_policy=0';
      f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
      f.setAttribute('title', '');
      f.addEventListener('load', function () {
        try {
          f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'cinema', channel: 'widget' }), '*');
        } catch (err) {}
      });
      zoneLecteur.appendChild(f);
    }

    function choisirFilm(i, jouer) {
      filmCourant = i;
      const bloc = BLOCKS[cur];
      const film = bloc.items[i];
      filmTitre.textContent = film.titre;
      filmTitre.style.fontSize = film.titre.length > 30 ? '1.35rem' : '2rem';
      minis.querySelectorAll('.mini').forEach(function (m) {
        m.classList.toggle('actif', parseInt(m.dataset.i, 10) === i);
      });
      if (jouer) lancer(film); else detruireIframe();
    }

    function classeTitre(t) { return t.length > 36 ? 'treslong' : (t.length > 21 ? 'long' : ''); }

    function render() {
      detruireIframe();
      document.body.classList.remove('reveal');
      btnToggle.textContent = 'VÉRIFIER';
      const bloc = BLOCKS[cur];
      catLabel.textContent = 'SESSION #' + (cur + 1) + ' / ' + BLOCKS.length;
      catTitle.textContent = bloc.name;

      minis.innerHTML = bloc.items.map(function (it, i) {
        return '<div class="card mini" data-i="' + i + '">' +
          '<div class="img-container"><img src="https://i.ytimg.com/vi/' + it.video + '/hqdefault.jpg" alt="" onerror="this.style.display=\'none\'"><div class="mini-tri"></div></div>' +
          '<div class="card-info"><b class="' + classeTitre(it.titre) + '">' + it.titre + '</b></div>' +
        '</div>';
      }).join('');
      minis.querySelectorAll('.mini').forEach(function (m) {
        m.addEventListener('click', function () { choisirFilm(parseInt(m.dataset.i, 10), true); });
      });

      const tries = bloc.items.slice().sort(function (a, b) { return a.annee - b.annee; });
      answerGrid.innerHTML = tries.map(function (it) {
        return '<div class="card answer-card">' +
          '<div class="year-tag">' + it.annee + '</div>' +
          '<div class="img-container"><img src="https://i.ytimg.com/vi/' + it.video + '/hqdefault.jpg" alt="" onerror="this.style.display=\'none\'"><div class="mini-tri"></div></div>' +
          '<div class="card-info"><b class="' + classeTitre(it.titre) + '">' + it.titre + '</b></div>' +
        '</div>';
      }).join('');

      choisirFilm(0, false);
    }

    grandEcran.addEventListener('click', function () {
      if (!zoneLecteur.querySelector('iframe')) {
        lancer(BLOCKS[cur].items[filmCourant]);
      }
    });

    function toggle() {
      const ouvert = document.body.classList.toggle('reveal');
      btnToggle.textContent = ouvert ? 'RETOUR' : 'VÉRIFIER';
      if (ouvert) detruireIframe();
    }

    function next() { if (cur < BLOCKS.length - 1) { cur++; render(); } }
    function prev() { if (cur > 0) { cur--; render(); } }

    render();
  </script>

</body>
</html>
