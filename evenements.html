<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrono Hasard - 160 Événements</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #ffd700; --bg: #111; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: #000; color: #fff; height: 100vh;
      display: flex; flex-direction: column;
      padding: 20px 40px 110px 40px; overflow: hidden; position: relative;
    }

    /* Arrière-plan Dés / Cube Hasard */
    body::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at center, transparent, #000),
        url('https://www.transparenttextures.com/patterns/cubes.png');
      z-index: -1; opacity: 0.25; animation: pan 100s linear infinite;
    }
    @keyframes pan { from { background-position: 0 0; } to { background-position: 1000px 1000px; } }

    .header-area { margin-bottom: 15px; flex-shrink: 0; }
    .cat-label { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 3px; }
    .cat-title { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; }

    .view-container { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* TOUJOURS 4 SUR UNE LIGNE */
      gap: 25px; width: 100%; max-width: 1400px;
    }
    
    #answerGrid { position: absolute; opacity: 0; pointer-events: none; transform: translateY(30px); transition: 0.6s; }
    body.reveal #gameGrid { opacity: 0; pointer-events: none; transform: translateY(-30px); }
    body.reveal #answerGrid { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .card {
      background: #1a1a1a; border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
      cursor: pointer; transition: 0.4s; border: 2px solid #333;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .card:hover { transform: translateY(-10px); border-color: var(--accent); }
    
    .img-container { width: 100%; aspect-ratio: 16/10; background: #000; overflow: hidden; }
    .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }
    .card:hover img { transform: scale(1.1); }
    
    /* VISIBILITÉ TEXTE AMÉLIORÉE */
    .card-info { 
      padding: 15px; 
      background: #222; 
      min-height: 100px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      text-align: center;
      border-top: 2px solid #333;
    }
    .card b { font-size: 0.9rem; line-height: 1.4; color: #eee; font-weight: 500; }

    .year-tag {
      position: absolute; top: 15px; right: 15px; background: var(--accent); color: #000;
      padding: 5px 15px; border-radius: 6px; font-weight: 900; font-size: 1.2rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 100px;
      display: flex; align-items: center; justify-content: center; gap: 30px;
      background: rgba(0,0,0,0.9); border-top: 1px solid #444;
    }
    .btn-side { background: #333; color: #fff; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; }
    .btn-main { background: var(--accent); color: #000; border: none; padding: 15px 60px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
  </style>
</head>
<body>

    let idx = 0;

    async function getWiki(w) {
      try {
        const r = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(w)}`);
        const d = await r.json();
        return d.thumbnail ? d.thumbnail.source : 'https://images.unsplash.com/photo-1461360370896-922624d12aa1?w=400';
      } catch(e) { return 'https://images.unsplash.com/photo-1461360370896-922624d12aa1?w=400'; }
    }

    function createCard(item, showYear) {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `
        ${showYear ? `<div class="year-tag">${item.y}</div>` : ''}
        <div class="img-container"><img src="${item.img}"></div>
        <div class="card-info"><b>${item.n}</b></div>
      `;
      return d;
    }

    async function render() {
      const g = document.getElementById('gameGrid');
      const ag = document.getElementById('answerGrid');
      const b = BLOCKS[idx];
      g.innerHTML = ag.innerHTML = "<div style='grid-column:1/-1;text-align:center;padding:100px;font-size:1.5rem;opacity:0.5'>Lancement des dés historiques...</div>";
      document.getElementById('catTitle').textContent = b.name;
      document.getElementById('catLabel').textContent = `DOSSIER #${idx+1} / 40`;
      
      const metas = await Promise.all(b.items.map(async item => { 
        const img = await getWiki(item.w); 
        return {...item, img}; 
      }));

      g.innerHTML = ""; metas.sort(()=>Math.random()-0.5).forEach(m => g.appendChild(createCard(m, false)));
      ag.innerHTML = ""; metas.sort((a,b)=>a.y-b.y).forEach(m => ag.appendChild(createCard(m, true)));
    }

    function toggle() {
      document.body.classList.toggle('reveal');
      document.getElementById('btnToggle').textContent = document.body.classList.contains('reveal') ? "RETOUR" : "VÉRIFIER";
    }

    function next() { if(idx<BLOCKS.length-1){idx++; document.body.classList.remove('reveal'); render();} }
    function prev() { if(idx>0){idx--; document.body.classList.remove('reveal'); render();} }
    window.onload = render;
  </script>
