  @keyframes entree { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  .visuel { position: relative; aspect-ratio: 4 / 3; background: #0b0e12; overflow: hidden; }
  .visuel img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 18px 26px; }

  const JEU = "L'ORDRE DES PRIX";
  let cur = Math.floor(Math.random() * SESSIONS.length);
  const cartesEl = document.getElementById('cartes');

  function carteHTML(it, avecValeur) {
    let visuel = '';
    if (it.img) visuel = '<img src="' + it.img + '" alt="" onerror="this.remove()">';
    else if (SESSIONS[cur].icone) visuel = '<div class="icone">' + SESSIONS[cur].icone + '</div>';
    return '<div class="carte"><div class="visuel">' + visuel +
      '<div class="rang">' + (it.rang || '') + '</div></div>' +
      '<div class="nom">' + it.nom + '</div>' +
      '<div class="sous">' + (it.sous || '') + '</div>' +
      '<div class="valeur">' + (it.valeur || '') + '</div></div>';
  }

  function render() {
    document.body.classList.remove('reveal');
    document.getElementById('btnToggle').textContent = 'VÉRIFIER';

    document.getElementById('catLabel').textContent = JEU + ' · Session #' + (cur + 1) + ' / ' + SESSIONS.length;
    document.getElementById('catTitle').textContent = s.titre;
    document.getElementById('consigne').textContent = s.consigne;
    document.getElementById('source').textContent = s.source || '';
    const affiches = s.ordre.map(i => s.items[i]);
    cartesEl.innerHTML = affiches.map(it => carteHTML(it, false)).join('');
    document.getElementById('btnPrev').disabled = (cur === 0);
    document.getElementById('btnNext').disabled = (cur === SESSIONS.length - 1);
  }

  function basculer() {
    const ouvert = document.body.classList.toggle('reveal');
    document.getElementById('btnToggle').textContent = ouvert ? 'RETOUR' : 'VÉRIFIER';
