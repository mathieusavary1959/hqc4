<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pionniers+5 - Bonus</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #2F9BFF; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Work Sans', sans-serif; background: #121216; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header {
      height: 70px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; background: rgba(26,26,31,0.98);
      border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 100; box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 2px; }
    .logo span { color: var(--accent); transition: color 0.4s; }
    .tabs { display: flex; gap: 40px; }
    .tab {
      color: #666; background: none; border: none; font-family: inherit; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; padding: 10px 0; position: relative; text-transform: uppercase; letter-spacing: 1.5px;
      transition: color 0.3s ease, transform 0.2s ease;
    }
    .tab:hover { color: #aaa; transform: translateY(-2px); }
    .tab[aria-selected="true"] { color: #fff; }
    .tab[aria-selected="true"]::after {
      content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 3px;
      background: var(--accent); box-shadow: 0 0 15px var(--accent);
    }
    .iframe-container { flex: 1; position: relative; background: #141419; }
    iframe#mainFrame { width: 100%; height: 100%; border: none; transition: opacity 0.5s ease; }
    .ecran-intro { position: fixed; inset: 0; z-index: 300; display: none !important; opacity: 1; transition: opacity 0.55s ease; }
    .ecran-intro.actif { display: block !important; }
    .ecran-intro.ferme { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <div class="logo">PIONNIERS+5 <span>BONUS</span></div>
    <nav class="tabs">
      <button class="tab" data-tab="monde" aria-selected="true">Monde contemporain</button>
      <button class="tab" data-tab="prix" aria-selected="false">Éducation financière</button>
    </nav>
  </header>
  <div class="iframe-container">
    <iframe id="mainFrame" src="b5v2-monde.html"></iframe>
  </div>
  <div class="ecran-intro attente" id="intro-monde"><style>
#intro-monde html, #intro-monde {
 margin: 0; padding: 0; background: #080809; height: 100%; overflow: hidden; }
#intro-monde {
 display: flex; align-items: center; justify-content: center; }
#intro-monde svg {
 width: 100vw; height: 100vh; display: block; }
#intro-monde #am-halo {
 opacity: 0; animation: am-haloIn 1.0s ease-out 0.05s forwards; }
@keyframes am-haloIn {
to {
 opacity: 1; }
 }
#intro-monde /* La planete : nee au centre, #intro-monde elle glisse ensuite a sa place a droite. */
  #am-globe {

    transform: translate(640px, 320px);
    animation: am-glisseGlobe 0.75s cubic-bezier(.3,.85,.3,1) 2.50s forwards;
  }
@keyframes am-glisseGlobe {
from {
 transform: translate(640px, 320px); }
to {
 transform: translate(818px, 320px); }

  }
#intro-monde /* Le contour de la planete se am-trace. */
  #am-contour {

    stroke-dasharray: 491;
    stroke-dashoffset: 491;
    animation: am-trace 1.15s cubic-bezier(.4,.6,.3,1) 0.25s forwards;
  }
@keyframes am-trace {
to {
 stroke-dashoffset: 0; }
 }
#intro-monde #am-monde {
 opacity: 0; animation: am-fonduIn 0.9s ease-out 0.85s forwards; }
@keyframes am-fonduIn {
to {
 opacity: 1; }
 }
#intro-monde /* Les continents defilent sans fin : la planete tourne. */
  #am-defile {

    animation: am-defileContinents 9s linear infinite;
  }
@keyframes am-defileContinents {
from {
 transform: translateX(0px); }
to {
 transform: translateX(-220px); }

  }
#intro-monde /* Le + nait au centre de la planete, #intro-monde un seul battement a l'arrivee, #intro-monde puis il se tient tranquille. */
  #am-croix {

    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    animation: am-croixIn 0.45s cubic-bezier(.25,.9,.3,1.35) 1.55s forwards, am-battementUnique 0.7s ease-in-out 3.45s 1;
  }
@keyframes am-croixIn {
from {
 transform: scale(0); }
to {
 transform: scale(1); }

  }
@keyframes am-battementUnique {
0%, 100% {
 transform: scale(1); }
50% {
 transform: scale(1.09); }

  }
#intro-monde #am-eclat {

    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
    animation: am-eclatJaillit 0.5s ease-out 1.95s forwards;
  }
@keyframes am-eclatJaillit {
0% {
 opacity: 0; transform: scale(0.45); }
22% {
 opacity: 1; }
100% {
 opacity: 0; transform: scale(1.5); }

  }
#intro-monde .lettre {

    font-family: 'Bebas Neue', sans-serif;
    font-size: 168px;
    fill: #2F9BFF;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
  }
@keyframes am-lettreIn {
from {
 opacity: 0; transform: translateX(-30px); }
to {
 opacity: 1; transform: translateX(0); }

  }
#intro-monde #am-l-0 {
 animation: am-lettreIn 0.45s cubic-bezier(.25,.8,.3,1) 2.55s forwards; }
#intro-monde #am-l-1 {
 animation: am-lettreIn 0.45s cubic-bezier(.25,.8,.3,1) 2.65s forwards; }
#intro-monde #am-l-2 {
 animation: am-lettreIn 0.45s cubic-bezier(.25,.8,.3,1) 2.75s forwards; }
#intro-monde #am-l-3 {
 animation: am-lettreIn 0.45s cubic-bezier(.25,.8,.3,1) 2.85s forwards; }
#intro-monde #am-ligne {

    transform-box: fill-box;
    transform-origin: center;
    transform: scaleX(0);
    animation: am-ligneIn 0.5s cubic-bezier(.3,.85,.3,1) 3.45s forwards;
  }
@keyframes am-ligneIn {
to {
 transform: scaleX(1); }
 }
#intro-monde #am-mention {

    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 9px;
    fill: #BDBDBD;
    opacity: 0;
    animation: am-mentionIn 0.7s ease-out 3.80s forwards;
  }
@keyframes am-mentionIn {
to {
 opacity: 0.95; }
 }
#intro-monde.attente * {
 animation-play-state: paused !important; }
</style>

  <script>
    const PAGES = { monde: 'b5v2-monde.html', prix: 'b5v2-prix.html' };
    const ACCENTS = { monde: '#2F9BFF', prix: '#10B981' };
    const frame = document.getElementById('mainFrame');
    const tabs = document.querySelectorAll('.tab');
    let matiere = 'monde';
    let minuteur = null;
    let introOuverte = null;

    function fermerIntro() {
      if (!introOuverte) return;
      const el = introOuverte;
      introOuverte = null;
      clearTimeout(minuteur);
      el.classList.add('ferme');
      setTimeout(() => { el.classList.remove('actif'); el.classList.remove('ferme'); }, 580);
    }
    function ouvrirIntro(id) {
      fermerIntroForcee();
      const el = document.getElementById(id);
      introOuverte = el;
      el.classList.remove('ferme'); el.classList.add('actif'); el.classList.add('attente');
      const demarrer = () => el.classList.remove('attente');
      if (document.fonts && document.fonts.ready) { document.fonts.ready.then(() => setTimeout(demarrer, 30)); setTimeout(demarrer, 1200); }
      else setTimeout(demarrer, 60);
      clearTimeout(minuteur);
      minuteur = setTimeout(fermerIntro, 5200);
      el.onclick = fermerIntro;
    }
    function fermerIntroForcee() {
      document.querySelectorAll('.ecran-intro').forEach(e => { e.classList.remove('actif'); e.classList.remove('ferme'); });
      introOuverte = null;
      clearTimeout(minuteur);
    }

    tabs.forEach(t => {
      t.addEventListener('click', () => {
        if (t.dataset.tab === matiere) return;
        matiere = t.dataset.tab;
        tabs.forEach(b => b.setAttribute('aria-selected', b === t ? 'true' : 'false'));
        document.documentElement.style.setProperty('--accent', ACCENTS[matiere]);
        ouvrirIntro(matiere === 'monde' ? 'intro-monde' : 'intro-ef');
        frame.style.opacity = '0';
        setTimeout(() => {
          frame.src = PAGES[matiere];
          frame.onload = () => frame.style.opacity = '1';
        }, 200);
      });
    });
    ouvrirIntro('intro-monde');
  </script>
