<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musique & Hasard - 160 Titres</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #ff0055; --bg: #0a0a0c; --card-bg: #1c1c1f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 40px 110px 40px;
      overflow: hidden;
      position: relative;
    }

    /* Arrière-plan Hasard / Casino */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 0, 85, 0.1) 0%, transparent 40%),
        url('https://www.transparenttextures.com/patterns/poker-qr.png');
      z-index: -1;
      opacity: 0.6;
    }

    .header-area { margin-bottom: 15px; flex-shrink: 0; text-align: left; }
    .cat-label { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 3px; }
    .cat-title { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; line-height: 1; }

    .view-container { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 1400px;
    }
    
    #answerGrid { position: absolute; opacity: 0; pointer-events: none; transform: scale(0.95); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    body.reveal #gameGrid { opacity: 0; pointer-events: none; transform: scale(1.05); }
    body.reveal #answerGrid { opacity: 1; pointer-events: auto; transform: scale(1); }

    .card {
      background: var(--card-bg); border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
      cursor: pointer; transition: 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 15px 40px rgba(255, 0, 85, 0.2); }
    
    .img-container { width: 100%; aspect-ratio: 1/1; position: relative; background: #000; }
    .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .card:hover img { filter: brightness(0.5); }
    
    /* Overlay Audio */
    .audio-overlay {
      position: absolute; top:0; left:0; width:100%; height:100%;
      display: flex; align-items: center; justify-content: center;
      gap: 15px; opacity: 0; transition: 0.3s;
    }
    .card:hover .audio-overlay { opacity: 1; }
    .btn-audio {
      background: #fff; border:none; width:50px; height:50px; border-radius:50%; cursor:pointer; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    /* VISIBILITÉ TEXTE AMÉLIORÉE */
    .card-info { 
      padding: 15px; 
      background: #111; 
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .card b { display: block; font-size: 1rem; color: #fff; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card span { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    .year-tag {
      position: absolute; top: 12px; left: 12px; background: var(--accent); color: #fff;
      padding: 4px 12px; border-radius: 6px; font-weight: 900; z-index: 20; font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 100px;
      display: flex; align-items: center; justify-content: center; gap: 30px;
      background: rgba(10, 10, 12, 0.9); backdrop-filter: blur(10px); border-top: 1px solid #333;
    }
    .btn-side { background: #222; color: #aaa; border: 1px solid #444; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.3s; }
    .btn-side:hover { color: #fff; border-color: #fff; }
    .btn-main { background: #fff; color: #000; border: none; padding: 15px 60px; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; }
    .btn-main:hover { background: var(--accent); color: #fff; transform: scale(1.05); }
  </style>
</head>

    let idx = 0;
    const player = document.getElementById('globalPlayer');

    function getTrack(s) {
      const r = RESOLVED[s.a + "|" + s.t];
      return r ? { img: r.img, url: r.url } : null;
    }

    function createCard(m, showYear) {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `
        ${showYear ? `<div class="year-tag">${m.y}</div>` : ''}
        <div class="img-container">
          <img src="${m.img || 'https://via.placeholder.com/400'}">
          <div class="audio-overlay">
            <button class="btn-audio" onclick="playS(event, '${m.url}')">▶</button>
            <button class="btn-audio" onclick="stopS(event)">■</button>
          </div>
        </div>
        <div class="card-info">
          <b>${m.t}</b>
          <span>${m.a}</span>
        </div>
      `;
      return d;
    }

    window.playS = (e, u) => { e.stopPropagation(); player.src = u; player.play(); };
    window.stopS = (e) => { e.stopPropagation(); player.pause(); };

    async function render() {
      const g = document.getElementById('gameGrid');
      const ag = document.getElementById('answerGrid');
      const b = BLOCKS[idx];
      g.innerHTML = ag.innerHTML = "<div style='grid-column:1/-1;text-align:center;padding:100px;font-size:1.5rem;opacity:0.5'>Brasser les cartes...</div>";
      document.getElementById('catTitle').textContent = b.name;
      document.getElementById('catLabel').textContent = `SESSION #${idx+1} / 40`;
      
      const metas = await Promise.all(b.s.map(async s => { const m = await getTrack(s); return {...s,...m}; }));
      
      g.innerHTML = ""; metas.sort(()=>Math.random()-0.5).forEach(m => g.appendChild(createCard(m, false)));
      ag.innerHTML = ""; metas.sort((a,b)=>a.y-b.y).forEach(m => ag.appendChild(createCard(m, true)));
    }

    function toggle() {
      document.body.classList.toggle('reveal');
      document.getElementById('btnToggle').textContent = document.body.classList.contains('reveal') ? "RETOUR" : "VÉRIFIER";
    }

    function next() { if(idx<BLOCKS.length-1){idx++; document.body.classList.remove('reveal'); render();} }
    function prev() { if(idx>0){idx--; document.body.classList.remove('reveal'); render();} }
    render();
  </script>
